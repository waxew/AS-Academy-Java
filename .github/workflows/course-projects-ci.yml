name: Java Course Projects CI

on:
  push:
    branches: [main]
    paths:
      - 'course/projects/**'
      - '.github/workflows/course-projects-ci.yml'
  pull_request:
    paths:
      - 'course/projects/**'

jobs:
  test-course-projects:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - course/projects/fundamentals/grade-analyzer
          - course/projects/beginner/invoice-manager
          - course/projects/advanced/student-jdbc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run project tests
        working-directory: ${{ matrix.project }}
        run: mvn --batch-mode test
